<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Ableton Session Mapper — Untitled Set</title>
  <style>:root {
  --ink: #090a0a;
  --panel: #111313;
  --panel-raised: #171919;
  --line: #303333;
  --line-soft: #222525;
  --paper: #e8e5dc;
  --muted: #918f87;
  --orange: #ff764d;
  --orange-hot: #ff9a63;
  --green: #86bd68;
  --rack: #f0c96c;
  --drum: #f08a53;
  --chain: #82b9ff;
  --font-display: "Avenir Next Condensed", "DIN Condensed", sans-serif;
  --font-mono: "SFMono-Regular", Menlo, Monaco, monospace;
}

* { box-sizing: border-box; }

html { background: var(--ink); color-scheme: dark; }

body {
  margin: 0;
  min-width: 320px;
  color: var(--paper);
  background:
    radial-gradient(circle at 78% -10%, rgba(255, 118, 77, .09), transparent 34rem),
    linear-gradient(180deg, rgba(255,255,255,.02), transparent 35rem),
    var(--ink);
  font-family: var(--font-mono);
  -webkit-font-smoothing: antialiased;
}

.ambient-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .19;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(to bottom, #000, transparent 70%);
}

.masthead, main, footer { position: relative; z-index: 1; }

.masthead {
  min-height: 230px;
  padding: 42px clamp(24px, 5vw, 80px) 35px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 30px;
  border-bottom: 1px solid var(--line);
}

.brand-block { display: flex; align-items: center; gap: 25px; }

.live-mark {
  width: 64px;
  height: 64px;
  padding: 12px 10px;
  display: flex;
  align-items: flex-end;
  gap: 5px;
  border: 1px solid var(--orange);
}

.live-mark i { width: 7px; background: var(--orange); animation: rise .7s both; }
.live-mark i:nth-child(1) { height: 48%; }
.live-mark i:nth-child(2) { height: 100%; animation-delay: 80ms; }
.live-mark i:nth-child(3) { height: 72%; animation-delay: 160ms; }
.live-mark i:nth-child(4) { height: 30%; animation-delay: 240ms; }

@keyframes rise { from { height: 0; opacity: 0; } }

.eyebrow, .export-time {
  margin: 0 0 9px;
  color: var(--orange);
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  max-width: 1000px;
  font-family: var(--font-display);
  font-size: clamp(46px, 7vw, 94px);
  font-weight: 700;
  letter-spacing: -.045em;
  line-height: .86;
  text-transform: uppercase;
}

.export-time { color: var(--muted); white-space: nowrap; }

.viewer-actions {
  position: sticky;
  top: 0;
  z-index: 10;
  min-height: 48px;
  padding: 8px clamp(24px, 5vw, 80px);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  border-bottom: 1px solid var(--line);
  background: rgba(9, 10, 10, .92);
  backdrop-filter: blur(16px);
}

.viewer-actions > span {
  margin-right: auto;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .18em;
}

.viewer-actions button {
  min-height: 30px;
  padding: 0 13px;
  color: var(--ink);
  border: 1px solid var(--orange);
  background: var(--orange);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .05em;
  cursor: pointer;
  transition: background .18s, color .18s, border-color .18s;
}

.viewer-actions button:hover { background: var(--orange-hot); }
.viewer-actions .close-action { color: var(--muted); border-color: var(--line); background: transparent; }
.viewer-actions .close-action:hover { color: var(--paper); border-color: var(--muted); }
.viewer-actions .debug-action { color: var(--orange); border-color: var(--orange); background: transparent; }
.viewer-actions .debug-action:hover { color: var(--ink); background: var(--orange); }

.view-mode-switch {
  display: inline-flex;
  padding: 3px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.02);
}

.view-mode-switch button {
  min-width: 72px;
  color: var(--muted);
  border-color: transparent;
  background: transparent;
}

.view-mode-switch button[aria-pressed="true"] {
  color: var(--ink);
  border-color: var(--orange);
  background: var(--orange);
}

main { padding: 0 clamp(24px, 5vw, 80px) 80px; }

.telemetry {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-left: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.telemetry article {
  min-height: 118px;
  padding: 23px 26px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid var(--line);
  background: rgba(17, 19, 19, .72);
}

.metric-value {
  font-family: var(--font-display);
  font-size: 52px;
  font-weight: 700;
  line-height: 1;
}

.metric-label, .detail-label {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
}

.session-sections { margin-top: 70px; }
.track-section + .track-section { margin-top: 68px; }

.section-heading {
  margin-bottom: 18px;
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  align-items: center;
  gap: 15px;
}

.section-heading > span {
  padding: 5px 7px;
  color: var(--ink);
  background: var(--orange);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .12em;
}

.section-heading h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 25px;
  letter-spacing: .025em;
  text-transform: uppercase;
}

.section-heading i { height: 1px; background: var(--line); }
.section-heading b { color: var(--muted); font-size: 11px; }
.track-stack { display: grid; gap: 10px; }

.track-divider {
  margin: 14px 0 2px;
  display: grid;
  grid-template-columns: auto auto 1fr;
  align-items: center;
  gap: 12px;
}

.track-divider span {
  padding: 4px 7px;
  color: var(--orange);
  border: 1px solid rgba(255, 118, 77, .35);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .12em;
}

.track-divider strong {
  color: var(--paper);
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.track-divider i {
  height: 1px;
  background: linear-gradient(90deg, rgba(255, 118, 77, .3), var(--line));
}

.track-card {
  --kind-accent: var(--orange);
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  overflow: hidden;
  border: 1px solid var(--line);
  background: rgba(17, 19, 19, .94);
  animation: card-in .45s cubic-bezier(.2,.8,.2,1) both;
  animation-delay: var(--delay);
  transition: border-color .2s, transform .2s;
}

.track-card:hover { border-color: #595d5c; transform: translateX(3px); }
.kind-midi { --kind-accent: #b7d86f; }
.kind-audio { --kind-accent: #68b8c8; }
.kind-return { --kind-accent: #c99ae8; }
.kind-master { --kind-accent: var(--orange); }
.kind-group { --kind-accent: #e9cf68; }

@keyframes card-in {
  from { opacity: 0; transform: translateY(10px); }
}

.track-rail {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  border-right: 1px solid var(--line);
  background: var(--panel-raised);
}

.track-rail span {
  width: 100%;
  padding: 13px 0;
  color: var(--kind-accent);
  border-top: 3px solid var(--kind-accent);
  font-size: 10px;
  text-align: center;
}

.track-body { min-width: 0; padding: 17px 20px 20px; }
.track-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.track-header > div:first-child { display: flex; align-items: baseline; gap: 13px; min-width: 0; }

.track-header h3 {
  margin: 0;
  overflow: hidden;
  font-family: var(--font-display);
  font-size: 27px;
  line-height: 1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.kind-tag {
  color: var(--kind-accent);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.track-state { display: flex; gap: 5px; }
.state-led {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  color: #626564;
  border: 1px solid var(--line);
  font-size: 9px;
  font-weight: 800;
}

.state-led.is-active { color: var(--ink); border-color: var(--orange); background: var(--orange); }

.routing-grid {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--line-soft);
}

.routing-grid div { min-width: 0; padding: 9px 12px; display: flex; gap: 12px; }
.routing-grid div + div { border-left: 1px solid var(--line-soft); }
.routing-grid span { color: var(--kind-accent); font-size: 9px; font-weight: 800; }
.routing-grid strong { color: var(--muted); font-size: 10px; font-weight: 400; }
.track-detail { margin-top: 18px; }
.detail-label { display: block; margin-bottom: 8px; }

.device-chain {
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  padding-bottom: 7px;
  scrollbar-color: var(--orange) var(--line-soft);
  scrollbar-width: thin;
}

.device-chain.depth-1,
.device-chain.depth-2,
.device-chain.depth-3 {
  padding-bottom: 0;
}

.device-node {
  flex: 0 0 auto;
  min-width: 220px;
  border: 1px solid #3d4140;
  background: var(--panel-raised);
}

.device-node-head {
  padding: 12px 13px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 12px;
  align-items: start;
}

.device-index {
  min-width: 28px;
  color: var(--orange);
  font-size: 9px;
  line-height: 1.2;
}

.device-heading { min-width: 0; }
.device-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }

.node-badge {
  padding: 3px 6px;
  display: inline-flex;
  align-items: center;
  border: 1px solid currentColor;
  font-size: 8px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.tone-default { color: var(--muted); }
.tone-device { color: var(--paper); }
.tone-rack { color: var(--rack); }
.tone-drum { color: var(--drum); }
.tone-chain { color: var(--chain); }
.tone-macro { color: var(--orange); }

.device-flag {
  padding: 3px 6px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 8px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.device-flag.is-on { color: var(--green); border-color: rgba(134, 189, 104, .5); }
.device-flag.is-off { color: #d07864; border-color: rgba(208, 120, 100, .5); }

.device-name {
  display: block;
  overflow: hidden;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  line-height: 1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.device-type {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 8px;
  text-transform: uppercase;
}

.device-parameters {
  padding: 0 13px 13px;
  border-top: 1px solid rgba(255,255,255,.04);
}

.device-parameters .detail-label {
  margin: 10px 0 8px;
}

.parameter-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.parameter-chip {
  min-width: 112px;
  padding: 8px 9px;
  display: grid;
  gap: 4px;
  border: 1px solid var(--line-soft);
  background: rgba(255,255,255,.02);
}

.parameter-chip strong {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
}

.parameter-chip em {
  color: var(--orange);
  font-style: normal;
  font-size: 9px;
}

.rack-node {
  min-width: min(700px, 82vw);
  border-color: rgba(240, 201, 108, .35);
  background:
    linear-gradient(180deg, rgba(240, 201, 108, .06), transparent 5rem),
    var(--panel-raised);
}

.rack-node > summary {
  list-style: none;
  padding-right: 13px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.rack-node > summary::-webkit-details-marker { display: none; }

.rack-meta {
  color: var(--rack);
  font-size: 9px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.rack-body {
  padding: 0 13px 13px;
  border-top: 1px solid rgba(255,255,255,.05);
}

.rack-chain-list {
  margin-top: 12px;
  display: grid;
  gap: 10px;
}

.chain-card {
  padding: 12px;
  border: 1px solid rgba(130, 185, 255, .22);
  background: rgba(9, 16, 24, .45);
}

.chain-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.chain-header h4 {
  margin: 6px 0 0;
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1;
}

.chain-kind {
  color: var(--muted);
  font-size: 8px;
  text-transform: uppercase;
}

.chain-state {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chain-state span {
  padding: 4px 7px;
  border: 1px solid rgba(130, 185, 255, .18);
  color: var(--chain);
  font-size: 8px;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.nested-device-chain {
  margin-top: 12px;
}

.nested-device-chain .device-node {
  min-width: 200px;
  background: #121616;
}

.chain-link {
  flex: 0 0 20px;
  align-self: center;
  height: 1px;
  background: var(--orange);
}

.chain-link::after {
  content: "";
  float: right;
  margin-top: -3px;
  border: 3px solid transparent;
  border-left-color: var(--orange);
}

.sends-row {
  display: grid;
  grid-template-columns: 100px minmax(0, 1fr);
  align-items: start;
  gap: 12px;
}

.sends-row .detail-label { padding-top: 7px; }
.send-list { display: flex; flex-wrap: wrap; gap: 6px; }
.send-chip { padding: 6px 8px; display: inline-flex; gap: 12px; border: 1px solid var(--line); background: #0d0f0f; font-size: 9px; }
.send-chip b { font-weight: 500; }
.send-chip em { color: var(--orange); font-style: normal; }
.empty-state, .empty-section { margin: 0; color: #62645f; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
.empty-state { padding: 10px 0; }
.empty-state.compact { padding: 7px 0; }
.empty-section { padding: 25px; border: 1px dashed var(--line); text-align: center; }

body.mode-compact .rack-body,
body.mode-compact .device-parameters,
body.mode-compact .chain-state,
body.mode-compact .nested-device-chain .device-parameters {
  display: none;
}

body.mode-compact .rack-node[open] > summary {
  border-bottom: 0;
}

.diagnostic-section { margin-top: 84px; scroll-margin-top: 70px; }
.diagnostic-empty { padding: 28px; display: flex; flex-direction: column; gap: 8px; border: 1px dashed var(--line); color: var(--muted); font-size: 11px; }
.diagnostic-empty strong { color: var(--paper); font-family: var(--font-display); font-size: 20px; }
.diagnostic-summary { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); }
.diagnostic-summary article { min-height: 86px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); background: var(--panel); }
.diagnostic-summary article:last-child { border-right: 0; }
.diagnostic-summary b { color: var(--orange); font-family: var(--font-display); font-size: 30px; }
.diagnostic-summary span { color: var(--muted); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; }
.diagnostic-tracks { margin-top: 20px; display: grid; gap: 12px; }
.diagnostic-track { padding: 18px; border: 1px solid var(--line); background: rgba(13,15,15,.94); }
.diagnostic-track > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.diagnostic-track > header div { display: flex; align-items: baseline; gap: 10px; }
.diagnostic-track > header span { color: var(--orange); font-size: 8px; text-transform: uppercase; }
.diagnostic-track > header h3 { margin: 0; font-family: var(--font-display); font-size: 24px; }
.diagnostic-track > header code { color: var(--muted); font-size: 9px; }
.diagnostic-id { margin: 8px 0 14px; color: #62645f; font-size: 8px; word-break: break-all; }
.diagnostic-object { margin-top: 8px; border: 1px solid var(--line-soft); background: #0b0d0d; }
.diagnostic-object summary { padding: 10px 12px; display: grid; grid-template-columns: 120px 130px 1fr; gap: 10px; color: var(--muted); cursor: pointer; font-size: 9px; }
.diagnostic-object summary b { color: var(--paper); }
.diagnostic-object summary em { overflow: hidden; font-style: normal; text-overflow: ellipsis; white-space: nowrap; }
.diagnostic-object-body { padding: 12px; border-top: 1px solid var(--line-soft); }
.available-list { display: flex; flex-wrap: wrap; gap: 4px; }
.available-list > span { width: 100%; margin-bottom: 4px; color: var(--muted); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; }
.available-list code { padding: 3px 5px; color: #9b9e98; border: 1px solid var(--line-soft); font-size: 8px; }
.property-table { margin-top: 12px; display: grid; gap: 3px; }
.diagnostic-property { min-height: 30px; padding: 6px 8px; display: grid; grid-template-columns: 62px 210px minmax(0, 1fr); align-items: start; gap: 8px; border-left: 2px solid var(--line); background: #101212; }
.diagnostic-property.status-available { border-left-color: var(--green); }
.diagnostic-property.status-error { border-left-color: #e46455; }
.property-status { color: var(--muted); font-size: 7px; text-transform: uppercase; }
.status-available .property-status { color: var(--green); }
.status-error .property-status { color: #e46455; }
.diagnostic-property code { color: var(--paper); font-size: 8px; }
.diagnostic-property pre { margin: 0; overflow: auto; color: #898c86; font-family: var(--font-mono); font-size: 8px; white-space: pre-wrap; word-break: break-word; }
.diagnostic-nested { margin-left: 14px; padding-left: 10px; border-left: 1px solid #282b2a; }
.chain-diagnostic { margin-left: 14px; }

footer {
  margin: 0 clamp(24px, 5vw, 80px);
  padding: 22px 0 35px;
  display: flex;
  align-items: center;
  gap: 15px;
  color: #5f625e;
  border-top: 1px solid var(--line);
  font-size: 8px;
  letter-spacing: .16em;
}

.footer-line { height: 1px; flex: 1; background: var(--line-soft); }
footer a { color: #777a74; text-decoration: none; transition: color .2s; }
footer a:hover { color: var(--orange); }

@media (max-width: 980px) {
  .viewer-actions {
    flex-wrap: wrap;
    justify-content: center;
  }

  .viewer-actions > span {
    width: 100%;
    margin-right: 0;
    text-align: center;
  }

  .rack-node {
    min-width: min(560px, 82vw);
  }
}

@media (max-width: 720px) {
  .masthead { min-height: 190px; align-items: flex-start; flex-direction: column; }
  .live-mark { width: 48px; height: 48px; }
  .export-time { align-self: flex-end; }
  .viewer-actions { padding-inline: 10px; }
  .telemetry { grid-template-columns: 1fr 1fr; }
  .telemetry article { min-height: 95px; }
  .metric-value { font-size: 40px; }
  .routing-grid { grid-template-columns: 1fr; }
  .routing-grid div + div { border-left: 0; border-top: 1px solid var(--line-soft); }
  .sends-row { grid-template-columns: 1fr; }
  .track-card { grid-template-columns: 34px minmax(0, 1fr); }
  .track-body { padding: 14px; }
  .track-header > div:first-child { display: block; }
  .kind-tag { display: block; margin-bottom: 5px; }
  .device-node,
  .rack-node {
    min-width: 82vw;
  }
  .diagnostic-summary { grid-template-columns: repeat(2, 1fr); }
  .diagnostic-summary article { border-bottom: 1px solid var(--line); }
  .diagnostic-object summary { grid-template-columns: 1fr; }
  .diagnostic-property { grid-template-columns: 60px 1fr; }
  .diagnostic-property pre { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
<body class="mode-detailed">
  <div class="ambient-grid" aria-hidden="true"></div>
  <header class="masthead">
    <div class="brand-block">
      <span class="live-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div>
        <p class="eyebrow">Ableton Session Mapper / JSON 1.0.0</p>
        <h1 id="project-name">Session Map</h1>
      </div>
    </div>
    <p class="export-time" id="export-time"></p>
  </header>

  <nav class="viewer-actions" aria-label="Actions du viewer">

    const sdkDiagnostic = null;

    function requestViewerAction(action) {
      const message = {
        method: "close_and_send",
        params: [JSON.stringify({ action })],

      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(message);
        return;
      }
      if (window.chrome?.webview) {
        window.chrome.webview.postMessage(message);
        return;

      if (action === "refresh") window.location.reload();
      if (action === "debug-sdk-data") {

      if (action === "export-html") {
        const blob = new Blob([document.documentElement.outerHTML], { type: "text/html" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "session-map.html";
        link.click();
        URL.revokeObjectURL(link.href);
      }
      if (action === "close") window.close();
    }

    function setViewMode(mode) {
      const normalizedMode = mode === "compact" ? "compact" : "detailed";
      document.body.classList.toggle("mode-compact", normalizedMode === "compact");
      document.body.classList.toggle("mode-detailed", normalizedMode === "detailed");
      document.querySelectorAll("[data-mode]").forEach((button) => {
        const isActive = button.getAttribute("data-mode") === normalizedMode;
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
      try {
        localStorage.setItem("ableton-session-mapper:view-mode", normalizedMode);
      } catch {}
    }

    const escapeHtml = (value) => String(value ?? "")

      return sum + 1 + nestedDevices;

    const sessionOrderTracks = [

        '<div class="diagnostic-summary">' + metrics.map(([value, label]) => '<article><b>' + value + '</b><span>' + label + '</span></article>').join("") + '</div>' +
        objectDiagnostic(sdkDiagnostic.song, "Song") +
